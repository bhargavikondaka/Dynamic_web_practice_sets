<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="index.css"/>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
</head>

<body>
    <div class="container" id="speedTypingTest">
        <div class="row p-3 test-container">
            <div class="col-12">
                <h1 class="speedTypingTest-heading">Speed Typing Test</h1>
                <p class="lets-go">on your fingers lets go!</p>
            </div>
            <div class="d-flex mt-4 mb-4">
                <img src="https://assets.ccbp.in/frontend/dynamic-webapps/clock-img.png" class="timer-img mr-4 mt-2">
                <p class="timer time-sec" id="timer"></p><span class="">seconds </span>
            </div>
            <div class="col-12 p-3 card">
                <p class="" id="quoteDisplay"></p>
                <div class="spinner-border" role="status" id="spinner"></div>
                <textarea id="quoteInput" rows=4 placeholder="type here!!!"></textarea>
            </div>
            <div class="col-12 mt-3">
                <p class="" id="result"></p>
                <div class="d-flex">
                    <button class="btn btn-primary mr-3" id="submitBtn">Submit</button>
                    <button class="btn btn-secondary" id="resetBtn">Reset</button>
                </div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
