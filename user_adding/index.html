<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
</head>

<body>
    <div class="p-4">
        <h1>Add User</h1>
        <form id="addUserForm">
            <div>
                <div class="d-flex flex-column mb-1">
                    <label for="name">Name</label>
                    <input type="text" id="name">
                    <p id="nameErrMsg" class="text-danger"></p>
                </div>
                <div class="d-flex flex-column mb-2">
                    <label for="email">Email</label>
                    <input type="text" id="email">
                    <p id="emailErrMsg" class="text-danger"></p>
                </div>
                <div class="d-flex flex-column">
                    <label for="status">Working status</label>
                    <select id="status" class="p-1">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                    <div>
                        <p class="mt-3">Gender</p>
                        <input type="radio" id="genderMale" name="gender" checked>
                        <label for="genderMale" class="ml-1">Male</label>
                        <input type="radio" id="genderFemale" name="gender" class="ml-2">
                        <label for="genderFemale" class="ml-1">Female</label>
                    </div>

                </div>
                <button class="btn btn-primary" id="submitBtn">Submit</button>
            </div>
        </form>
    </div>
    <script src="index.js"></script>
</body>

</html>
